[project]
name = "workspacebench-lite"
version = "0.1.0"
description = "An open-weights judge for WorkspaceBench's jailbreak_recognition family"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "workspace-bench",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsbjev"]

[tool.uv.sources]
# a submodule pinned at 92d763e, installed editable so WorkspaceBench finds its evals/ data
workspace-bench = { path = "third_party/workspace-bench", editable = true }
